<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moji recepti</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="page">

  <!-- ===== top bar ===== -->
  <div class="topbar">
    <div id="navList">
      <h2 style="margin:0;">
        <span style="font-family:var(--font-serif); font-size:21px; font-weight:600;">Moji recepti</span>
      </h2>
    </div>
    <button class="back-link" id="navDetail" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      Svi recepti
    </button>
    <span class="count" id="listCount"></span>
  </div>

  <!-- ===== list view ===== -->
  <div id="listView">
    <div class="filters" id="filters"></div>
    <div class="list" id="list"><div class="empty-list">Učitavanje recepata…</div></div>
  </div>

  <!-- ===== detail view ===== -->
  <div id="detailView">
    <article class="card">
      <div class="card-media">
        <div class="hero" id="hero">
          <div id="heroVisual" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"></div>
          <span class="hero-tag" id="tab"></span>
          <button class="hero-save" id="saveBtn" aria-label="Sačuvaj recept">
            <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.2C.4 8.4 2 4.5 6 4c2-.2 3.6.8 6 3 2.4-2.2 4-3.2 6-3 4 .5 5.6 4.4 4 7.8C19.5 16.4 12 21 12 21z"/></svg>
          </button>
        </div>
        <!-- statistika (porcije/kcal/proteini) — prikazuje se ovde samo na desktopu -->
        <div class="meta meta-side" id="metaSide"></div>
      </div>

      <div class="card-body">
        <h2 class="title" id="title"></h2>
        <p class="desc" id="desc"></p>
        <div class="meta" id="meta"></div>

        <section>
          <h3 class="sec">Sastojci <span class="hint">dodirni + za listu</span></h3>
          <div id="ingredients"></div>
        </section>

        <section>
          <h3 class="sec">Priprema</h3>
          <ol class="steps" id="steps"></ol>
        </section>

        <section id="notesSection">
          <h3 class="sec">Napomene</h3>
          <div class="notes" id="notes"></div>
        </section>

        <section id="nutritionSection">
          <h3 class="sec">Kalorije i proteini</h3>
          <table class="ledger">
            <colgroup id="ledgerCols"></colgroup>
            <thead id="ledgerHead"></thead>
            <tbody id="ledgerBody"></tbody>
          </table>
        </section>

        <div class="src" id="src"></div>
      </div>
    </article>
  </div>
</div>

<!-- ===== lista za kupovinu: FAB + sheet ===== -->
<button class="fab" id="fabBtn" aria-label="Lista za kupovinu">
  <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9.5" cy="20" r="1.3" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.3" fill="currentColor" stroke="none"/></svg>
  <span class="fab-badge hidden" id="fabBadge">0</span>
</button>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Lista za kupovinu">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3>Lista za kupovinu</h3>
    <button class="sheet-close" id="sheetClose" aria-label="Zatvori">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot" style="display:none;">
    <button class="clear-btn" id="clearBtn">Obriši listu</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/shopping-list.js"></script>
<script src="js/app.js"></script>
<script type="module" src="js/firebase-data.js"></script>
</body>
</html>
